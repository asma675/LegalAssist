services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rafi
      POSTGRES_USER: rafi
      POSTGRES_PASSWORD: rafi
    volumes:
      - rafi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafi -d rafi"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rafi_net

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rafi:rafi@db:5432/rafi
      UPLOAD_DIR: /app/uploads
    volumes:
      - rafi_uploads:/app/uploads
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"
        ]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - rafi_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rafi_net

volumes:
  rafi_db:
  rafi_uploads:

networks:
  rafi_net:
    driver: bridge
