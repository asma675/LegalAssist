services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rafi
      POSTGRES_USER: rafi
      POSTGRES_PASSWORD: rafi
    volumes:
      - rafi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafi -d rafi"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://rafi:rafi@db:5432/rafi
      UPLOAD_DIR: /app/uploads
    volumes:
      - rafi_uploads:/app/uploads
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  rafi_db:
  rafi_uploads:
